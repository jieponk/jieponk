<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rudi Parwanto — E-Commerce Specialist. Building tools for real workflows.">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".06"/></pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353"/><stop offset=".45" stop-color="#39d353"/>
      <stop offset=".5" stop-color="#b7ffc4"/><stop offset=".55" stop-color="#39d353"/><stop offset="1" stop-color="#39d353"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;.35;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="win"><rect x="24" y="24" width="1152" height="252" rx="14"/></clipPath>
    <clipPath id="codeClip"><rect x="806" y="74" width="346" height="168" rx="8"/></clipPath>
    <clipPath id="type1"><rect x="56" y="194" height="24" width="0">
      <animate attributeName="width" values="0;0;352;352;0" keyTimes="0;.055;.255;.95;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type2"><rect x="56" y="220" height="24" width="0">
      <animate attributeName="width" values="0;0;372;372;0" keyTimes="0;.31;.51;.95;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .blob{animation:drift 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .b2{animation-duration:22s;animation-delay:-6s}.b3{animation-duration:26s;animation-delay:-12s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,-30px) scale(1.15)}100%{transform:translate(-60px,25px) scale(.95)}}
    .tw{animation:tw 3.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    .float{animation:float 5s ease-in-out infinite;transform-box:fill-box}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .scroll{animation:scroll 16s linear infinite}
    @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-160px)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
    .fadein{animation:fade 1s ease both}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- background -->
  <rect width="1200" height="300" rx="18" fill="#0b0f17"/>
  <g clip-path="url(#win)">
    <rect x="24" y="24" width="1152" height="252" fill="#0d1117"/>
    <g filter="url(#blur)" opacity=".55">
      <circle class="blob" cx="260" cy="250" r="150" fill="#7c3aed"/>
      <circle class="blob b2" cx="720" cy="40" r="140" fill="#0a84ff"/>
      <circle class="blob b3" cx="1050" cy="260" r="130" fill="#39d353" opacity=".7"/>
    </g>
    <rect x="24" y="24" width="1152" height="252" fill="url(#dots)"/>
    <g fill="#c0caf5">
      <circle class="tw" cx="520" cy="80" r="1.4"/><circle class="tw" style="animation-delay:-.8s" cx="610" cy="230" r="1.2"/>
      <circle class="tw" style="animation-delay:-1.6s" cx="700" cy="120" r="1.6"/><circle class="tw" style="animation-delay:-2.4s" cx="760" cy="200" r="1.1"/>
      <circle class="tw" style="animation-delay:-1.1s" cx="470" cy="150" r="1.2"/><circle class="tw" style="animation-delay:-2s" cx="1160" cy="90" r="1.3"/>
    </g>
  </g>

  <!-- window frame -->
  <rect x="24.5" y="24.5" width="1151" height="251" rx="14" fill="none" stroke="#30363d"/>
  <path d="M38.5 24.5h1123a14 14 0 0 1 14 14v19.5H24.5V38.5a14 14 0 0 1 14-14z" fill="#161b22" opacity=".92"/>
  <line x1="24.5" y1="58" x2="1175.5" y2="58" stroke="#30363d"/>
  <circle cx="46" cy="41" r="6" fill="#ff5f57"/><circle cx="66" cy="41" r="6" fill="#febc2e"/><circle cx="86" cy="41" r="6" fill="#28c840"/>
  <text x="600" y="45.5" text-anchor="middle" class="mono" font-size="12.5" fill="#8b949e">jieponk@github: ~/masrudi.site — zsh</text>

  <!-- left: identity -->
  <g>
    <text x="56" y="90" class="mono" font-size="14" fill="#6a9955">// E-Commerce Systems &amp; Automation</text>
    <text x="56" y="140" class="mono" font-size="44" font-weight="800" fill="#e6edf3" letter-spacing="1">RUDI <tspan fill="url(#shine)">PARWANTO</tspan></text>
    <text x="56" y="170" class="sans" font-size="18" fill="#8b949e">E-Commerce Specialist · <tspan fill="#4ec9b0">Jakarta, Indonesia</tspan></text>
  </g>

  <!-- typing lines -->
  <g class="mono" font-size="16">
    <text x="56" y="212" clip-path="url(#type1)" textLength="352" lengthAdjust="spacingAndGlyphs"><tspan fill="#39d353">❯</tspan><tspan fill="#e6edf3"> building tools for real workflows</tspan></text>
    <text x="56" y="238" clip-path="url(#type2)" textLength="372" lengthAdjust="spacingAndGlyphs"><tspan fill="#39d353">✓</tspan><tspan fill="#8b949e"> shipped:</tspan><tspan fill="#70a5fd"> urbanix.id</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#bf91f3">masrudi.site</tspan></text>
    <rect class="blink" width="9" height="18" fill="#39d353">
      <animate attributeName="x" values="60;60;414;414;60;434;434;60" keyTimes="0;.055;.255;.309;.31;.51;.95;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="197;197;223;223;197" keyTimes="0;.309;.31;.95;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- middle: floating chips -->
  <g class="sans" font-size="12" font-weight="600">
    <g class="float"><rect x="540" y="88" width="78" height="26" rx="13" fill="#ee4d2d" fill-opacity=".16" stroke="#ee4d2d" stroke-opacity=".55"/><text x="579" y="105" text-anchor="middle" fill="#ff8a70">Shopee</text></g>
    <g class="float" style="animation-delay:-1.2s"><rect x="650" y="122" width="104" height="26" rx="13" fill="#25f4ee" fill-opacity=".1" stroke="#25f4ee" stroke-opacity=".45"/><text x="702" y="139" text-anchor="middle" fill="#7ff9f5">TikTok Shop</text></g>
    <g class="float" style="animation-delay:-2.4s"><rect x="556" y="160" width="82" height="26" rx="13" fill="#e6edf3" fill-opacity=".08" stroke="#e6edf3" stroke-opacity=".35"/><text x="597" y="177" text-anchor="middle" fill="#e6edf3">Next.js</text></g>
    <g class="float" style="animation-delay:-3.1s"><rect x="664" y="196" width="96" height="26" rx="13" fill="#f38020" fill-opacity=".14" stroke="#f38020" stroke-opacity=".5"/><text x="712" y="213" text-anchor="middle" fill="#ffad66">Cloudflare</text></g>
    <g class="float" style="animation-delay:-4s"><rect x="520" y="214" width="100" height="26" rx="13" fill="#39d353" fill-opacity=".12" stroke="#39d353" stroke-opacity=".5"/><text x="570" y="231" text-anchor="middle" fill="#7ee787">Automation</text></g>
  </g>

  <!-- right: mini editor -->
  <rect x="806" y="74" width="346" height="168" rx="8" fill="#010409" fill-opacity=".72" stroke="#30363d"/>
  <g clip-path="url(#codeClip)" class="mono" font-size="12" xml:space="preserve">
    <g class="scroll">
      <g id="code">
        <text x="818" y="96"><tspan fill="#484f58">1  </tspan><tspan fill="#ff7b72">const</tspan><tspan fill="#d2a8ff"> price</tspan><tspan fill="#e6edf3"> = (cost, fee) =&gt; {</tspan></text>
        <text x="818" y="116"><tspan fill="#484f58">2  </tspan><tspan fill="#ff7b72" dx="15">const</tspan><tspan fill="#e6edf3"> margin = </tspan><tspan fill="#79c0ff">0.18</tspan><tspan fill="#e6edf3">;</tspan></text>
        <text x="818" y="136"><tspan fill="#484f58">3  </tspan><tspan fill="#ff7b72" dx="15">return</tspan><tspan fill="#d2a8ff"> ceil</tspan><tspan fill="#e6edf3">(cost / (1 - fee - margin));</tspan></text>
        <text x="818" y="156"><tspan fill="#484f58">4  </tspan><tspan fill="#e6edf3">};</tspan></text>
        <text x="818" y="176"><tspan fill="#484f58">5  </tspan><tspan fill="#d2a8ff">sync</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'shopee'</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">'tiktok'</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#a5d6ff">'blibli'</tspan><tspan fill="#e6edf3">);</tspan></text>
        <text x="818" y="196"><tspan fill="#484f58">6  </tspan><tspan fill="#d2a8ff">deploy</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'urbanix.id'</tspan><tspan fill="#e6edf3">);  </tspan><tspan fill="#6a9955">// ✓ live</tspan></text>
        <text x="818" y="216"><tspan fill="#484f58">7  </tspan><tspan fill="#d2a8ff">deploy</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">'masrudi.site'</tspan><tspan fill="#e6edf3">); </tspan><tspan fill="#6a9955">// ✓ live</tspan></text>
        <text x="818" y="236"><tspan fill="#484f58">8  </tspan><tspan fill="#d2a8ff">automate</tspan><tspan fill="#e6edf3">(workflow);    </tspan><tspan fill="#6a9955">// repeat</tspan></text>
      </g>
      <use href="#code" y="160"/>
    </g>
  </g>

  <!-- status bar -->
  <path d="M24.5 254h1151v7.5a14 14 0 0 1-14 14h-1123a14 14 0 0 1-14-14z" fill="#161b22"/>
  <line x1="24.5" y1="254" x2="1175.5" y2="254" stroke="#30363d"/>
  <path d="M24.5 254h34v21.5h-20a14 14 0 0 1-14-14z" fill="#0066d6"/>
  <text x="41" y="269" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fff">&gt;&lt;</text>
  <g class="sans" font-size="11.5" fill="#8b949e">
    <text x="72" y="269">⎇ main</text>
    <text x="130" y="269">✓ 0 problems</text>
    <text x="820" y="269">E-Commerce · Automation · Web Dev · Marketplace</text>
  </g>
  <circle cx="1148" cy="265" r="4" fill="#39d353"/><circle class="pulse" cx="1148" cy="265" r="4" fill="#39d353"/>
  <text x="1138" y="269" text-anchor="end" class="sans" font-size="11.5" fill="#7ee787">online</text>
</svg>
